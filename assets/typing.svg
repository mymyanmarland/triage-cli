<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64">
  <rect width="900" height="64" rx="12" fill="#0b1626"/>
  <rect width="900" height="64" rx="12" fill="none" stroke="#1e3a52"/>
  <g font-family="'Courier New', monospace" font-size="21" fill="#5ff5c8">
    <text x="28" y="41" opacity="0">Site down? Run triage first — before touching anything.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.3;0.36;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="41" opacity="0">1,277 log lines in → one 50-line report out.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.42;0.63;0.69;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="41" opacity="0">Secrets redacted. Errors deduplicated. Read-only, always.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.69;0.75;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="856" y="20" width="11" height="24" fill="#39c2ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.06s" repeatCount="indefinite"/>
  </rect>
</svg>
