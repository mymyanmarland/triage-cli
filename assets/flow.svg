<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10233a"/>
      <stop offset="1" stop-color="#0b1828"/>
    </linearGradient>
    <path id="wire" d="M0 0 H52" fill="none"/>
  </defs>
  <rect width="1200" height="250" rx="16" fill="#081120"/>

  <!-- connectors with travelling pulses -->
  <g stroke="#24506e" stroke-width="2.5" fill="none">
    <line x1="216" y1="105" x2="268" y2="105"/>
    <line x1="452" y1="105" x2="504" y2="105"/>
    <line x1="688" y1="105" x2="740" y2="105"/>
    <line x1="924" y1="105" x2="976" y2="105"/>
  </g>
  <g fill="#5ff5c8">
    <circle r="5"><animateMotion dur="1.6s" repeatCount="indefinite" path="M216 105 H268"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" path="M452 105 H504"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite" path="M688 105 H740"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite" path="M924 105 H976"/></circle>
  </g>

  <!-- nodes -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <g>
      <rect x="32" y="55" width="184" height="100" rx="14" fill="url(#box)" stroke="#39c2ff" stroke-width="1.6"/>
      <text x="124" y="98" fill="#eaf4ff" font-size="19" font-weight="700" text-anchor="middle">Server logs</text>
      <text x="124" y="126" fill="#7f97ad" font-size="14" text-anchor="middle">journal · nginx · PM2</text>
    </g>
    <g>
      <rect x="268" y="55" width="184" height="100" rx="14" fill="url(#box)" stroke="#2ee6a8" stroke-width="1.6">
        <animate attributeName="stroke-width" values="1.6;3;1.6" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="360" y="98" fill="#eaf4ff" font-size="19" font-weight="700" text-anchor="middle">triage collect</text>
      <text x="360" y="126" fill="#7f97ad" font-size="14" text-anchor="middle">one read-only pass</text>
    </g>
    <g>
      <rect x="504" y="55" width="184" height="100" rx="14" fill="url(#box)" stroke="#39c2ff" stroke-width="1.6"/>
      <text x="596" y="98" fill="#eaf4ff" font-size="19" font-weight="700" text-anchor="middle">Dedupe</text>
      <text x="596" y="126" fill="#7f97ad" font-size="14" text-anchor="middle">×232 means ONE problem</text>
    </g>
    <g>
      <rect x="740" y="55" width="184" height="100" rx="14" fill="url(#box)" stroke="#8f7bff" stroke-width="1.6"/>
      <text x="832" y="98" fill="#eaf4ff" font-size="19" font-weight="700" text-anchor="middle">Redact</text>
      <text x="832" y="126" fill="#7f97ad" font-size="14" text-anchor="middle">secrets never leave</text>
    </g>
    <g>
      <rect x="976" y="55" width="192" height="100" rx="14" fill="url(#box)" stroke="#2ee6a8" stroke-width="1.6"/>
      <text x="1072" y="98" fill="#eaf4ff" font-size="19" font-weight="700" text-anchor="middle">1 report</text>
      <text x="1072" y="126" fill="#7f97ad" font-size="14" text-anchor="middle">any agent can read it</text>
    </g>
  </g>

  <text x="600" y="205" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#5f7d95" text-anchor="middle">system · services · ports · errors · summary — in a single file</text>
  <!-- heartbeat under line -->
  <path d="M430 224 h60 l7 -10 9 20 7 -10 h254" fill="none" stroke="#2ee6a8" stroke-width="2" stroke-linejoin="round" pathLength="400" stroke-dasharray="400" stroke-dashoffset="400">
    <animate attributeName="stroke-dashoffset" values="400;0;-400" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
