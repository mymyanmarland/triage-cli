<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <rect width="900" height="330" rx="14" fill="#0a141f"/>
  <rect width="900" height="46" rx="14" fill="#12222f"/>
  <rect y="24" width="900" height="22" fill="#12222f"/>
  <circle cx="26" cy="23" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="23" r="7" fill="#febc2e"/>
  <circle cx="74" cy="23" r="7" fill="#28c840"/>
  <text x="450" y="29" font-family="'Courier New', monospace" font-size="14" fill="#7f97ad" text-anchor="middle">triage — read-only</text>

  <g font-family="'Courier New', monospace" font-size="17">
    <text x="28" y="86" fill="#eaf4ff" opacity="0">$ triage collect --hours 24
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.04;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="122" fill="#5ff5c8" opacity="0">## Summary — 0 failed services · 16 ports · disk 42%
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.2;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="152" fill="#9db8cc" opacity="0">## 1. System — memory 50% · load 0.12 · uptime 3 weeks
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="182" fill="#9db8cc" opacity="0">## 2. Services — systemd running · failed: none
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.44;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="212" fill="#9db8cc" opacity="0">## 3. Ports — 22, 80, 443, 3001, 3017, 3020, 5432 …
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.56;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="242" fill="#ffd479" opacity="0">## 4. Errors — 1,277 lines → 606 signatures, top ×232
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.68;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="272" fill="#c4b5ff" opacity="0">password=[REDACTED] · token=[REDACTED] · key=[REDACTED]
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="306" fill="#5ff5c8" opacity="0">✓ report ready — 50 lines. The agent takes it from here.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.92;1" dur="11s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
