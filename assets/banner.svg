<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081120"/>
      <stop offset="0.55" stop-color="#0d2138"/>
      <stop offset="1" stop-color="#0a2e2a"/>
      <animate attributeName="x1" values="0;0.25;0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0.6;1" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ff5c8"/>
      <stop offset="0.5" stop-color="#39c2ff"/>
      <stop offset="1" stop-color="#8f7bff"/>
      <animate attributeName="x2" values="1;1.6;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="plus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- ECG trace, drawn and redrawn -->
    <g fill="none" stroke="#2ee6a8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
      <path d="M0 246 H180 l14 -26 18 52 14 -26 H420 l14 -26 18 52 14 -26 H660 l14 -26 18 52 14 -26 H900 l14 -26 18 52 14 -26 H1200"
            pathLength="1200" stroke-dasharray="1200" stroke-dashoffset="1200">
        <animate attributeName="stroke-dashoffset" values="1200;0;-1200" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke="#39c2ff" stroke-width="2" stroke-linejoin="round" opacity="0.35">
      <path d="M0 262 H200 l12 -18 15 36 12 -18 H460 l12 -18 15 36 12 -18 H720 l12 -18 15 36 12 -18 H980 l12 -18 15 36 12 -18 H1200"
            pathLength="1200" stroke-dasharray="10 14">
        <animate attributeName="stroke-dashoffset" values="0;-240" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- shine sweep -->
    <rect x="-320" y="-80" width="180" height="480" fill="#ffffff" opacity="0.06" transform="rotate(18)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1700 0" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <!-- pulse rings + medical cross -->
    <g>
      <circle cx="118" cy="118" r="34" fill="none" stroke="#2ee6a8" stroke-width="2" opacity="0">
        <animate attributeName="r" values="34;78" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="118" cy="118" r="34" fill="none" stroke="#39c2ff" stroke-width="2" opacity="0">
        <animate attributeName="r" values="34;78" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="118" cy="118" r="46" fill="#0b1c2e" stroke="#2ee6a8" stroke-width="1.5"/>
      <path d="M118 92 v52 M92 118 h52" stroke="url(#plus)" stroke-width="15" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.72;1" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- title -->
    <text x="196" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#title)">triage-cli</text>
    <text x="198" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c7d7e8">Read-only server incident reports, built for AI agents.</text>
    <text x="198" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#7f97ad">One command. One compact report. No raw-log archaeology.</text>

    <!-- floating chips -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.6s" repeatCount="indefinite"/>
        <rect x="790" y="52" width="158" height="38" rx="19" fill="#0e2a22" stroke="#2ee6a8"/>
        <text x="869" y="77" fill="#5ff5c8" text-anchor="middle">READ-ONLY</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4.4s" repeatCount="indefinite"/>
        <rect x="962" y="52" width="186" height="38" rx="19" fill="#0d2237" stroke="#39c2ff"/>
        <text x="1055" y="77" fill="#8fd8ff" text-anchor="middle">ZERO DEPENDENCIES</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" repeatCount="indefinite"/>
        <rect x="876" y="104" width="212" height="38" rx="19" fill="#221a3d" stroke="#8f7bff"/>
        <text x="982" y="129" fill="#c4b5ff" text-anchor="middle">SECRETS REDACTED</text>
      </g>
    </g>

    <!-- version pill -->
    <g>
      <rect x="52" y="252" width="118" height="34" rx="17" fill="#2ee6a8"/>
      <text x="111" y="275" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#06251b" text-anchor="middle">v0.1.0 LIVE</text>
      <animate attributeName="opacity" values="1;0.82;1" dur="2.2s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
